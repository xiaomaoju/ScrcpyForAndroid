name: Android Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  release-build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/Cache/ci-signing/release.p12
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'; do
            android --sdk="$ANDROID_HOME" sdk install "$package"
          done

      - name: Prepare release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          [[ "$base_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          version_name="${base_version}-build.${GITHUB_RUN_NUMBER}"
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          tag="v${version_name}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$(dirname "$RELEASE_STORE_FILE")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Test and build signed ARM64 release
        env:
          CI_VERSION_NAME: ${{ steps.version.outputs.name }}
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          -PabiList=arm64-v8a
          -PciVersionName="$CI_VERSION_NAME"
          -PciVersionCode="$CI_VERSION_CODE"

      - name: Verify and collect APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          mkdir -p Cache/release
          asset="ScrcpyForAndroid-${RELEASE_VERSION}-arm64-v8a.apk"
          cp "$apk" "Cache/release/$asset"
          (cd Cache/release && sha256sum "$asset" > SHA256SUMS.txt)
          {
            echo '# Samsung Galaxy Z Flip5 专用版'
            echo
            echo '适用于三星 Galaxy Z Flip5（SM-F731 系列），ARM64，已签名 Release APK。'
            echo '这是 main / 版本标签的自动构建，不代表完成新的真机回归。'
            echo
            echo "- 版本：${RELEASE_VERSION}"
            echo "- 提交：[${GITHUB_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- [下载 APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset})"
            echo "- [功能与使用说明](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md)"
            echo
            echo '首次从旧 Debug 测试版或其他签名版本切换时，需要先卸载旧版（请先备份应用数据）；后续自动发布版本使用同一密钥，可覆盖升级。'
          } > Cache/release/RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flip5-release-${{ steps.version.outputs.name }}
          path: |
            Cache/release/*.apk
            Cache/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flip5 ${{ steps.version.outputs.name }}
          body_path: Cache/release/RELEASE_NOTES.md
          files: |
            Cache/release/*.apk
            Cache/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ contains(github.ref_name, '_pre') }}

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RELEASE_STORE_FILE"
